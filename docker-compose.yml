services:
  shorturl-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shorturl-api
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Data Source=/data/shorturl.db
      App__BaseUrl: ${APP_BASE_URL:-http://localhost:5000}
      Security__ApiKey: ${SHORTURL_API_KEY:?Set SHORTURL_API_KEY before starting Compose}
    volumes:
      - shorturl-data:/data
    restart: unless-stopped

volumes:
  shorturl-data:
